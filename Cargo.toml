[package]
name = "hrdf-routing-engine"
version = "0.7.1"
edition = "2024"
description = "Public transport routing engine based on Swiss HRDF data."
repository = "https://github.com/urban-travel/hrdf-routing-engine"
license-file = "LICENSE"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
contour = "0.13.1"
csv = { version = "1.4.0", optional = true }
# For -Zminimal-versions
flate2 = "1.1.10"
futures = "0.3.34"
geo = "0.33.1"
geojson = "1.0.0"
hex = "0.4.3"
hrdf-parser = "0.10.0"
kd-tree = "0.6.2"
log = "0.4.34"
# For -Zminimal-versions
native-tls = "0.2.18"
orx-parallel = "4.0.0"
postcard = { version = "1.1.3", features = ["use-std"] }
pretty_assertions = "1.4.1"
reqwest = "0.13.5"
rustc-hash = "2.1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
simple_logger = "5.2.0"
strum = "0.28.0"
strum_macros = "0.28.0"
svg = { version = "0.18.0", optional = true }
test-log = "0.2.21"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread"] }
tower-http = { version = "0.6.11", features = ["cors"] }
typenum = "1.20.1"
url = "2.5.8"
zip = { version = "8.6.0", optional = true }

[dev-dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures = "0.3.34"
ojp-rs = "0.2.4"
rand = "0.10.2"
test-log = { version = "0.2.21", features = ["trace"] }

[features]
default = ["hectare", "svg"]
hectare = ["dep:csv", "dep:zip"]
svg = ["dep:svg"]

[profile.dev]
opt-level = 3

[profile.release]
# lto = true
